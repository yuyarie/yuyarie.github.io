<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yuyarie 的个人网站，记录项目、学习与生活。">
  <title>Yuyarie · 个人主页</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./favicon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f5f1; color: #252b27; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.8; }
    main { width: min(100% - 48px, 780px); margin: 0 auto; padding: 100px 0 40px; }
    .label { color: #587460; font-size: 13px; letter-spacing: .16em; }
    h1 { margin: 20px 0; font-size: clamp(42px, 8vw, 72px); line-height: 1.15; letter-spacing: -.04em; }
    .intro { max-width: 520px; font-size: 19px; color: #626961; }
    a { color: #315b43; text-underline-offset: 5px; }
    .button { display: inline-block; margin-top: 20px; padding: 10px 22px; border: 1px solid #315b43; border-radius: 30px; text-decoration: none; }
    .button:hover { background: #315b43; color: white; }
    a:focus-visible { outline: 3px solid #819d68; outline-offset: 5px; }
    section { margin-top: 80px; padding-top: 24px; border-top: 1px solid #d9ddd4; }
    h2 { font-size: 20px; }
    footer { margin-top: 90px; color: #747b72; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="label">YUYARIE / PERSONAL WEBSITE</div>
    <h1>你好，我是 Yuyarie。</h1>
    <p class="intro">欢迎来到我的小小空间。这里将记录我的项目、学习与生活，以及那些值得分享的发现。</p>
    <a class="button" href="https://github.com/yuyarie">访问我的 GitHub ↗</a>
    <a class="button" href="./downloadpage/">进入下载站 →</a>
    <section aria-labelledby="about">
      <h2 id="about">关于这里</h2>
      <p>网站刚刚开始，更多内容正在慢慢生长。<br>保持好奇，持续创造。</p>
    </section>
    <footer>© Yuyarie · Built with curiosity. Hosted on GitHub Pages.</footer>
  </main>
</body>
</html>
